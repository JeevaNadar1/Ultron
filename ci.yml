name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate and build
        run: |
          unzip -q ultron.skill -d /tmp/committed
          bash build.sh
          unzip -q ultron.skill -d /tmp/built

      # The zip is not byte-reproducible (timestamps), so compare contents.
      - name: Committed ultron.skill matches source
        run: |
          if ! diff -r /tmp/committed/ultron /tmp/built/ultron; then
            echo "::error::ultron.skill is stale. Run 'bash build.sh' and commit the result."
            exit 1
          fi

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: bash build.sh
      - run: gh release create "$GITHUB_REF_NAME" ultron.skill --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
